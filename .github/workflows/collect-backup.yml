name: Backup collection (manual)

# BACKUP. The daily pass runs on the VPS; see docs/vps-deployment.md. This is
# kept, and costs nothing kept, as the clean-room way to run a pass while that
# machine is being changed or is suspect: a runner starts from the committed log
# and needs nothing the VPS holds. It does not fire on its own, because two
# schedules at 04:38 Pacific would spend one credit budget twice and race each
# other's push, so reaching for it is always a deliberate act.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent sources
        default: '3'
        type: string
      enable_jsearch:
        description: Run the paid fixed JSearch plan
        type: boolean
        default: false
      dry_run:
        description: Collect without committing the result
        type: boolean
        default: false
      force_backfill:
        description: Run the sweep outside the cycle's final days, to test it
        type: boolean
        default: false
      backfill_budget:
        description: Cap the sweep's page credits; 0 uses its computed share
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  # Two passes at once would both read the same watermarks and race the push.
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4

      - name: Check out the data repository
        id: data_checkout
        uses: actions/checkout@v4
        with:
          repository: TanoZhang/Operation1million-data
          # Both repositories are private, so the built-in token cannot reach the
          # other one. A fine-grained PAT with Contents:write on the data
          # repository is the whole credential this workflow needs.
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Restore operational safety state
        id: restore_state
        run: |
          mkdir -p .local
          for name in source_access.sqlite jsearch_usage.sqlite; do
            if [ ! -s "data-repo/operational/$name" ]; then
              echo "::error::Required operational ledger is missing or empty: $name"
              exit 1
            fi
            cp "data-repo/operational/$name" ".local/$name"
          done
          if [ -f .local/jsearch_usage.sqlite ]; then
            cp .local/jsearch_usage.sqlite .local/jsearch_usage.before.sqlite
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e .

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild the database from the committed log
        id: rebuild
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        # The runner has no database. Everything is derived: the catalog from
        # schema.sql and the migrations, the postings from the log.
        run: job-store --bootstrap --verify

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          # Scheduled runs perform paid discovery. Manual runs are free unless
          # enable_jsearch is explicitly selected in workflow_dispatch.
          ENABLE_JSEARCH: ${{ github.event_name == 'schedule' || inputs.enable_jsearch }}
        # Sources are committed to the store one at a time, so a timeout or a
        # cancelled run still keeps every board it finished.
        run: |
          args=(
            --workers "${{ inputs.workers || '3' }}"
            --delay 1.0
            --jsearch-max-seconds 6000
            --jsearch-timeout 30
          )
          if [ "$ENABLE_JSEARCH" = 'true' ]; then
            job-collect --jsearch-only --jsearch-plan
            args+=(--jsearch)
          else
            args+=(--jsearch-budget 0)
          fi
          set +e
          job-collect "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo '::warning::Collection completed with partial or paused sources; inspect the report.'
          fi
          exit "$code"

      # The cycle rolls every 30 days rather than landing on a day of the month,
      # so the window is computed from the ledger, never from a cron date.
      - name: Decide whether the cycle is ending
        id: sweep_window
        if: ${{ steps.collect.outputs.exit_code == '0' || steps.collect.outputs.exit_code == '2' }}
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from jobdisco import jsearch
          from jobdisco.jsearch_access import RequestGuard
          settings, _ = jsearch.load_plan()
          guard = RequestGuard(target_limit=settings['monthly_target'],
                               cycle_start=settings['cycle_start'],
                               cycle_days=settings['cycle_days'])
          days = guard.days_until_reset()
          forced = "${{ inputs.force_backfill }}" == 'true'
          print(f'days_until_reset={days}')
          print(f'run={"true" if days <= 3 or forced else "false"}')
          PY

      # Unused credits do not carry into the next cycle, so the last three days
      # spend what the daily passes left. A daily failure skips this entirely:
      # a sweep on top of a broken pass would spend the remainder for nothing.
      - name: Backfill sweep
        id: backfill
        continue-on-error: true
        # A dry run discards what it collected, so a sweep under one would
        # spend the cycle's remaining credits and throw the results away.
        if: ${{ steps.sweep_window.outputs.run == 'true' && inputs.dry_run != true && (github.event_name == 'schedule' || inputs.enable_jsearch) }}
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          echo "::notice title=Backfill::${{ steps.sweep_window.outputs.days_until_reset }} days until the cycle resets"
          # A bare test under `bash -e` would end the step when it is false.
          budget=()
          if [ "${{ inputs.backfill_budget || '0' }}" != '0' ]; then
            budget=(--jsearch-budget "${{ inputs.backfill_budget }}")
          fi
          job-collect --jsearch-only --backfill --workers 1 --delay 1.0 \
            --jsearch-max-seconds 3000 "${budget[@]}"

      - name: Save operational safety state
        if: ${{ always() && steps.restore_state.outcome == 'success' }}
        run: |
          mkdir -p data-repo/operational
          for name in source_access.sqlite jsearch_usage.sqlite; do
            if [ -f ".local/$name" ]; then
              cp ".local/$name" "data-repo/operational/$name"
            fi
          done

      - name: Commit durable state
        env:
          # The check below reads the store being committed, not the default path.
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        if: ${{ always() && steps.data_checkout.outcome == 'success' && steps.rebuild.outcome == 'success' }}
        working-directory: data-repo
        run: |
          publication_failed=0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The data repository ignores SQLite generally because the job database
          # is derived. These are different: the quota and cooldown ledgers are
          # authoritative and must survive a runner, and the applications log is
          # the record of what has been applied for -- the one thing here that
          # cannot be collected again if it is lost.
          for name in operational/source_access.sqlite operational/jsearch_usage.sqlite operational/applications.ndjson; do
            if [ -f "$name" ]; then
              git add -f "$name"
            fi
          done
          if [ "${{ inputs.dry_run || false }}" = 'true' ]; then
            summary=$(python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('../runs').glob('*/manifest.json'), key=lambda p: p.stat().st_mtime)
          data = json.loads(files[-1].read_text()) if files else {}
          print(f"dry run: discarding durable collection result: "
                f"{data.get('store_new', 0)} new, {data.get('store_closed', 0)} closed, "
                f"{data.get('store_seen', 0)} seen; triage report retained")
          PY
            )
            echo "::notice title=Dry run discarded::$summary"
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            git restore --worktree --source=HEAD -- runs manifests source_state.json
            git clean -fd -- runs manifests
          else
            # Never publish a store that cannot verify itself. A run killed
            # outright -- a runner timeout, a cancelled job -- can stop between
            # sharding the day's log and sealing its manifest, and this step
            # runs on cancellation too. Committing that leaves the data
            # repository unable to rebuild, which is worse than losing a pass.
            if ! python -c "
          import sys
          from jobdisco import store
          bad = [(d, s) for d, s in store.verify() if s != 'ok']
          for d, s in bad:
              print(f'::error title=Unverified store::{d}: {s}')
          sys.exit(1 if bad else 0)
          "; then
              echo '::warning::Collected postings were not committed; the store did not verify.'
              publication_failed=1
              python -m jobdisco.workflow_state operational/jsearch_usage.sqlite ../.local/jsearch_usage.before.sqlite
              if [ -f operational/jsearch_usage.sqlite ]; then
                git add -f operational/jsearch_usage.sqlite
              fi
            else
              git add runs manifests source_state.json
              # The collector seals this snapshot on success and handled failure.
              # Publish it only with verified, non-dry-run collection state.
              if [ -f operational/seen_jobs.ndjson.gz ]; then
                git add -f operational/seen_jobs.ndjson.gz
              fi
            fi
          fi
          if git diff --cached --quiet; then
            echo 'No durable state changed.'
            exit "$publication_failed"
          fi
          git commit -m "Checkpoint collection $(date -u +%Y-%m-%d)"
          # A changed remote may contain reservations absent from this runner.
          # Reject the push rather than merging independent quota histories.
          git push origin main
          exit "$publication_failed"

      - name: Summarise
        if: ${{ always() && steps.data_checkout.outcome == 'success' }}
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        run: |
          job-store --verify >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          latest=$(find data-repo/manifests -maxdepth 1 -name '*.json' -type f 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No manifest is available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the run report for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          # company_results.csv only; the postings themselves are in the data
          # repository, and artifact storage is the small quota on this plan.
          path: runs/*/company_results.csv
          retention-days: 14
          if-no-files-found: warn

      # The sweep carries continue-on-error so its partial results still reach
      # the commit, which would otherwise leave a broken sweep silently green --
      # and the sweep is the pass that spends what the cycle has left.
      - name: Report backfill failure
        if: ${{ always() && steps.backfill.outcome == 'failure' }}
        run: exit 1

      - name: Report unexpected collection failure
        if: ${{ always() && steps.collect.outcome == 'failure' && steps.collect.outputs.exit_code != '2' }}
        run: exit 1
