name: Offline tests

# The offline suite, on every push to main and every pull request into it. It
# needs no secret and no data: the repository is public, and the tests that
# read the private index (data/db/job_discovery.sqlite) skip without it. On
# Ubuntu the POSIX-only tests -- flock, process groups, file modes -- run,
# which the Windows workstation cannot do. Install time stays where it was:
# deploy/local/deploy-vps.bat runs the suite before it installs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes the older run's answer moot.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The VPS runs Ubuntu 24.04 with its Python 3.12.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned to commits, not tags: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Run the offline suite
        # A clean environment, as the VPS pass runs it: no store, no key.
        run: |
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 PYTHONUNBUFFERED=1 \
            python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      - name: List skipped tests
        if: always()
        run: |
          {
            echo '### Skipped tests'
            echo '```'
            grep -E ' \.\.\. skipped' test-output.txt || echo 'none'
            echo '```'
            tail -n 3 test-output.txt
          } >> "$GITHUB_STEP_SUMMARY"
