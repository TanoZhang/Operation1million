name: Daily collection

# Scheduled runs are queued behind everyone else's at the top of the hour, so ask
# for an odd minute. Private repositories are not auto-disabled for inactivity.
on:
  schedule:
    - cron: '17 6 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent sources
        default: '3'
        type: string
      enable_jsearch:
        description: Run the paid fixed JSearch plan
        type: boolean
        default: false
      dry_run:
        description: Collect without committing the result
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two passes at once would both read the same watermarks and race the push.
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4

      - name: Check out the data repository
        id: data_checkout
        uses: actions/checkout@v4
        with:
          repository: TanoZhang/Operation1million-data
          # Both repositories are private, so the built-in token cannot reach the
          # other one. A fine-grained PAT with Contents:write on the data
          # repository is the whole credential this workflow needs.
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Restore operational safety state
        run: |
          mkdir -p .local
          for name in source_access.sqlite jsearch_usage.sqlite; do
            if [ -f "data-repo/operational/$name" ]; then
              cp "data-repo/operational/$name" ".local/$name"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e .

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild the database from the committed log
        id: rebuild
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        # The runner has no database. Everything is derived: the catalog from
        # schema.sql and the migrations, the postings from the log.
        run: job-store --bootstrap --verify

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          # Scheduled runs perform paid discovery. Manual runs are free unless
          # enable_jsearch is explicitly selected in workflow_dispatch.
          ENABLE_JSEARCH: ${{ github.event_name == 'schedule' || inputs.enable_jsearch }}
        # Sources are committed to the store one at a time, so a timeout or a
        # cancelled run still keeps every board it finished.
        run: |
          args=(
            --workers "${{ inputs.workers || '3' }}"
            --delay 1.0
          )
          if [ "$ENABLE_JSEARCH" = 'true' ]; then
            job-collect --jsearch-only --jsearch-plan
            args+=(--jsearch)
          else
            args+=(--jsearch-budget 0)
          fi
          set +e
          job-collect "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo '::warning::Collection completed with partial or paused sources; inspect the report.'
          fi
          exit "$code"

      - name: Save operational safety state
        if: ${{ always() && steps.data_checkout.outcome == 'success' }}
        run: |
          mkdir -p data-repo/operational
          for name in source_access.sqlite jsearch_usage.sqlite; do
            if [ -f ".local/$name" ]; then
              cp ".local/$name" "data-repo/operational/$name"
            fi
          done

      - name: Commit durable state
        if: ${{ always() && steps.data_checkout.outcome == 'success' && steps.rebuild.outcome == 'success' }}
        working-directory: data-repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The data repository ignores SQLite generally because the job database
          # is derived. These two small databases are different: they are the
          # authoritative quota and cooldown ledgers and must survive a runner.
          for name in operational/source_access.sqlite operational/jsearch_usage.sqlite; do
            if [ -f "$name" ]; then
              git add -f "$name"
            fi
          done
          if [ "${{ inputs.dry_run || false }}" = 'true' ]; then
            summary=$(python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('../runs').glob('*/manifest.json'), key=lambda p: p.stat().st_mtime)
          data = json.loads(files[-1].read_text()) if files else {}
          print(f"dry run: discarding durable collection result: "
                f"{data.get('store_new', 0)} new, {data.get('store_closed', 0)} closed, "
                f"{data.get('store_seen', 0)} seen; triage report retained")
          PY
            )
            echo "::notice title=Dry run discarded::$summary"
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            git restore --worktree --source=HEAD -- runs manifests source_state.json
            git clean -fd -- runs manifests
          else
            git add runs manifests source_state.json
          fi
          if git diff --cached --quiet; then
            echo 'No durable state changed.'
            exit 0
          fi
          git commit -m "Checkpoint collection $(date -u +%Y-%m-%d)"
          # A concurrent push is unlikely under the concurrency group, but rebasing
          # is safe here: the day files are append-only and the manifests are
          # per-day, so there is nothing to merge by hand.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Summarise
        if: ${{ always() && steps.data_checkout.outcome == 'success' }}
        env:
          JOBDISCO_STORE: ${{ github.workspace }}/data-repo
        run: |
          job-store --verify >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          latest=$(find data-repo/manifests -maxdepth 1 -name '*.json' -type f 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No manifest is available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the run report for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          # company_results.csv only; the postings themselves are in the data
          # repository, and artifact storage is the small quota on this plan.
          path: runs/*/company_results.csv
          retention-days: 14
          if-no-files-found: warn

      - name: Report unexpected collection failure
        if: ${{ always() && steps.collect.outcome == 'failure' && steps.collect.outputs.exit_code != '2' }}
        run: exit 1
