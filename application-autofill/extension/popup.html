<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Application Autofill</h1>
    <label for="application-route">Work route for this position</label>
    <select id="application-route"><option value="">Choose when sponsorship depends on it</option>
      <option value="cpt">CPT</option><option value="other">Other / non-CPT</option></select>
    <div class="actions">
      <button id="fill-known">Rescan and fill known answers</button>
      <button id="edit-answers">Set up your answers</button>
    </div>
    <section id="review-panel" hidden>
      <h2>Review before filling</h2>
      <p class="scope-note">Choose where each answer may be suggested. All sites still requires the same question and options.</p>
      <div id="review-items"></div>
      <button id="fill-review" class="review" disabled>Save scope and fill selected</button>
    </section>
    <p id="status" role="status">Scanning this page...</p>
    <details><summary>How each question was matched</summary><div id="question-report"></div></details>
    <p class="note">Unknown fields stay empty. Values you enter are remembered after you leave the field.</p>
  </main>
  <script src="answer-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
