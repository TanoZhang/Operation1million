[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobdisco"
version = "0.1.0"
description = "Compliant job source discovery and collection pipeline"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
  # `tomllib` arrived in 3.11 and this package supports 3.10, where every
  # entry point that reads the query plan needs `tomli` instead. It was an
  # optional extra nothing installed, so a 3.10 install was one import away
  # from failing and nothing said so. The marker makes it appear exactly where
  # it is needed and nowhere else.
  "tomli>=2.2.1; python_version < '3.11'",
  # The page-credit budget resets when the scheduled pass runs, which is a wall
  # clock time in America/Los_Angeles, so `zoneinfo` has to be able to find that
  # zone. A Linux box has it in the system tzdata; Windows ships none at all,
  # and a slim container often ships none either. Unconditional, because the
  # failure it prevents is a ZoneInfoNotFoundError at the moment a pass starts.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
research = ["curl-cffi>=0.15.0"]

[project.scripts]
job-collect = "jobdisco.collector:main_cli"
job-validate-sources = "jobdisco.validate_sources:main"
job-queries = "jobdisco.query_catalog:main"
job-store = "jobdisco.store:main"
job-review = "jobdisco.review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobdisco = ["review_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
