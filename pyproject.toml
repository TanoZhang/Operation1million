[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobdisco"
version = "0.1.0"
description = "Compliant job source discovery and collection pipeline"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
compat = ["tomli>=2.2.1; python_version < '3.11'"]
research = ["curl-cffi>=0.15.0"]

[project.scripts]
job-collect = "jobdisco.collector:main_cli"
job-validate-sources = "jobdisco.validate_sources:main"
job-queries = "jobdisco.query_catalog:main"
job-store = "jobdisco.store:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
