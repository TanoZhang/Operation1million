<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications | Job review</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">APPLICATIONS<span>Job review</span></a><span class="local"><i></i>Local workspace</span><button id="refresh" title="Refresh queue" aria-label="Refresh queue">&#8635;</button></header>
<main>
<section class="overview"><div><span class="eyebrow">YOUR NEXT MOVE</span><h1>Review queue</h1><p>New postings first, then the backlog; early career and low relevance have their own tabs</p></div><div class="metrics"><div><strong id="remaining">&mdash;</strong><span>Remaining</span></div><div><strong id="applied">&mdash;</strong><span>Applied</span></div><div><strong id="skipped">&mdash;</strong><span>Skipped</span></div></div></section>
<div id="error" role="alert" hidden></div>
<div class="selection-tools"><label><input id="select-matching" type="checkbox"> Select all matching positions</label><button id="clear-selection" type="button">Clear selection</button><button id="download-selected" type="button" class="primary" disabled>Download selected Excel (0)</button></div>
<nav aria-label="Application status"><div class="tabs"><button data-tab="pending" aria-pressed="true">To review <span id="pending-count"></span></button><button data-tab="early" aria-pressed="false">Early career <span id="early-count"></span></button><button data-tab="backlog" aria-pressed="false">Backlog <span id="backlog-count"></span></button><button data-tab="less" aria-pressed="false">Low relevance <span id="less-count"></span></button><button data-tab="applied" aria-pressed="false">Applied</button><button data-tab="skipped" aria-pressed="false">Skipped</button></div><label class="search"><span class="sr-only">Search company or title</span><input id="search" type="search" placeholder="Search company or title"></label></nav>
<div class="workspace"><section class="queue" aria-label="Jobs"><div class="list-label"><span>COMPANY / POSITION</span><span class="list-tools"><label class="sort-control"><span class="sr-only">Sort positions</span><select id="sort"><option value="fit-desc">Fit high to low, then newest</option><option value="fit-desc-oldest">Fit high to low, then oldest</option><option value="fit-asc">Fit low to high, then newest</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="recommended">Recommended order</option></select></label><button id="export" type="button" class="export" title="Download selected positions, or the current list when none are checked (key: E)">Download Excel <kbd>E</kbd></button></span></div><div id="list" aria-live="polite"><div class="empty">Loading jobs...</div></div></section><section id="detail" class="detail" aria-label="Selected job"><div class="empty">Select a position</div></section></div>
<footer><span id="count"></span><span id="saved" role="status">Application ledger</span></footer>
</main>
<dialog id="skip-dialog"><form id="skip-form"><h2>Skip this position?</h2><label for="reason">Reason <span class="muted">(optional)</span></label><textarea id="reason" maxlength="2000" rows="4" placeholder="Location, role, timing..."></textarea><div class="dialog-actions"><button type="button" id="cancel-skip">Cancel</button><button class="primary" type="submit">Skip position</button></div></form></dialog>
</body></html>
