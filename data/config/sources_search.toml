# Paid functional discovery and explicitly configured company fallback.
# Direct company sources remain the primary collection path.

version = 1

[search.jsearch]
name = "JSearch (OpenWeb Ninja direct)"
access_method = "direct_search_api"
auth = "api_key_header"
endpoint_template = "https://api.openwebninja.com/jsearch/search-v2"
required_config = ["JSEARCH_API_KEY"]
response_items_path = "data.jobs"
title_field = "job_title"
link_field = "job_apply_link"
link_fallback_fields = ["job_apply_link", "job_google_link"]
apply_links_path = "apply_options"
source_job_id_field = "job_id"
employer_field = "employer_name"
docs_url = "https://www.openwebninja.com/api/jsearch"
risk_tier = "low"

[search.jsearch.connection]
auth_header = "X-API-Key"

[search.jsearch.limits.requests]
scope = "provider_account"
# Page-credit budgets are configured in jsearch_queries.toml.
concurrent_requests = 1

[search.jsearch.limits.request_capacity]
scope = "request"
rows_per_page = 10
