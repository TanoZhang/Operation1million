# Nationwide daily plan. Each broad query has its own maximum depth, asks for
# one page at a time, and stops early when the provider runs short.
version = 1
monthly_quota = 10000
target_utilization = 0.96
operating_days = 30
daily_budget = 320
# The plan renews every 30 days from this date, not on a day of the month.
cycle_start = "2026-09-16"
cycle_days = 30

# The daily budget exists to give the scheduled pass its allowance, so the day
# it paces begins when that pass does -- not at a UTC midnight, which falls at
# 17:00 Pacific and handed the next morning's credits to anything run in the
# evening. Measured once before this was written: a catch-up run at 18:05 and
# 20:10 Pacific took 296 of 320 credits, and the pass eleven hours later got 24
# and reached fifteen of its fifty-two queries.
#
# Keep these in step with deploy/vps/jobdisco-collect.timer. If the timer moves,
# these move with it, or the budget will again reset at a time nothing observes.
budget_timezone = "America/Los_Angeles"
budget_day_resets_at = "04:38"
country = "us"
date_posted = "3days"
# Runaway guard only: the ceiling no tier's depth may exceed.
max_pages_per_query = 40

# A backfill sweep spends credits that expire with the cycle, so it pages far
# deeper than a daily pass before its own runaway guard binds.
backfill_max_pages_per_query = 200

employment_types = ["FULLTIME", "INTERN"]

# Priority is intern -> new_grad -> early_career -> A. Daily query caps total
# exactly 320; short and empty pages still stop a query before its cap.
# A month-wide backfill uses separate deeper caps for the same four tiers.
[backfill_tier_pages]
intern = 60
new_grad = 50
early_career = 40
A = 30

[filter]
# Relevance scoring. Terms only ever add; nothing is deducted for a term being
# absent, so a sparsely written posting is never punished for what it omits.
#
#   score      = sum over matched terms of (weight * position multiplier)
#   confidence = 100 * score / (score + half_score)        0..100
#
# A posting carrying `certain_strong_hits` distinct strong terms skips the curve
# and scores 100: that many trade-exclusive proper nouns in one posting is not
# something another industry produces by accident.
#
# To edit: add the term to the list it belongs to. Entries are regular
# expressions matched case-insensitively against the title and the description.
# Bound a term with \b at both ends so it does not match inside a longer word.
min_confidence = 25
# 0 leaves the curve running instead of flattening every posting that reaches
# a fixed number of strong terms onto 100. Measured: 798 postings read 100,
# the terms behind them ranging from 6 distinct to 34, and nothing at all
# scored between 70 and 99.
certain_strong_hits = 0
half_score = 15
strong_weight = 3
common_weight = 1
title_multiplier = 2
# Below this length a description was truncated by the publisher rather than
# genuinely silent, so its silence is not counted as evidence against a posting.
min_description_chars = 1500

# Hard exclusions, checked before anything else. These answer "would I take this
# job at all", which no amount of relevance can overturn: a defence programme is
# still a defence programme when the work is verification, and a director is
# still a director. Everything below this point only decides how relevant a
# posting is, never whether it is acceptable.
#
# Company exclusions are matched against employer identity, not job titles.
exclude_employer_patterns = [
  '\bLockheed\s+Martin\b', '\bNorthrop\s+Grumman\b',
  '\bRaytheon\b', '\bGeneral\s+Dynamics\b', '\bBAE\s+Systems\b',
  '\bL3Harris\b', '\bLeidos\b', '\bAnduril\b',
  '\bBoeing\b', '\bCACI\b', '\bAmentum\b', '\bPeraton\b',
  # Ambiguous abbreviations require an exact name or a known corporate suffix.
  '^\s*RTX(?:\s+(?:Corporation|Corp\.?|Inc\.?))?\s*$',
  '^\s*SAIC(?:\s+(?:Corporation|Corp\.?|Inc\.?))?\s*$',
  '\bScience\s+Applications\s+International\s+Corporation\b',
]

# Role and programme exclusions apply to titles.
exclude_title_patterns = [
  # Human resources roles, not an HR contact mentioned in a description.
  '\bHR\b', '\bhuman\s+resources?\b',
  # Defence and weapons programmes
  '\bdefen[cs]e\b', '\bmilitary\b', '\bDoD\b', '\bDepartment\s+of\s+Defen[cs]e\b',
  '\bwarfighter\b', '\bweapons?\b', '\bweapon\s+systems?\b', '\bmissile\b',
  '\bmunitions?\b', '\bradar\b', '\belectronic\s+warfare\b', '\bEW\s+systems?\b',
  '\bfire\s+control\b', '\btargeting\b', '\bguidance\s+systems?\b',
  '\bcombat\s+systems?\b', '\btactical\s+systems?\b', '\bmission\s+systems?\b',
  '\bdefen[cs]e\s+contractor\b', '\bgovernment\s+clearance\b',
  '\bsecurity\s+clearance\b',
  # Management: not an individual-contributor track
  '\bdirector\b', '\bmanaging\s+director\b', '\bmanagers?\b',
  '\bvice\s+president\b', '\bVP\b', '\bSVP\b', '\bEVP\b', '\bhead\s+of\b',
  '\bchief\b', '\bC[TEIF]O\b',
  # Functions that are not the trade at all. These were soft rejects, and a soft
  # reject is only consulted when confidence falls below min_confidence -- but a
  # sales or technician posting at a semiconductor company is written in the
  # trade's vocabulary, so it clears the threshold and the soft reject never
  # fires. Measured on the live queue: 423 sales, 151 marketing and 633
  # technician postings were surviving exactly that way.
  '\bsales\b', '\bmarketing\b', '\btechnician\b',
  # Levels above what an early-career application reaches
  '\bsenior\b', '\bsr\b\.?', '\bprincipal\b', '\blead\b',
  # Blocked wherever it appears, at the user's request on 2026-09-22; the
  # same word is in exclude_publisher_patterns, which reads the whole link.
  '\btrabajos?\b',
  '\bfellow\b', '\bdistinguished\s+engineer\b', '\bdistinguished\s+member\b',
  # Unrelated disciplines: title-only exclusions, before explicit trade keeps.
  '\bphotonics?\b', '\boptical\s+engineer\b', '\boptics\s+engineer\b',
  '\boptoelectronics?\b', '\blaser\s+engineer\b',
  '\bprocess\s+(?:engineer|integration)\b', '\bsemiconductor\s+process\b',
  # "Device" on its own is not a fab word: Device Validation, Embedded Device,
  # PCIe Device and Device Driver are all roles worth seeing, and a bare
  # '\bdevice\s+engineer\b' killed them to reach the eighteen fab postings the
  # store actually holds. So only the explicit phrases -- the work named after
  # the transistor rather than after the chip -- and only where a fab process
  # word stands next to it.
  '\bdevice\s+(?:integration|physics|process|characteri[sz]ation|modell?ing)\b',
  '\b(?:semiconductor|silicon|cmos|nand|dram|flash|oled|foundry|fab|wafer|transistor)\b(?:\s+\w+){0,2}\s+device\s+engineer\b',
  '\b(?:process|technology)\s*/\s*device\b', '\bdevice\s*/\s*process\b',
  '\byield\s+engineer\b',
  '\b(?:fab|fabrication)\s+engineer\b', '\blithography\b', '\bthin[-\s]+films?\b',
  '\b(?:etch|deposition)\s+engineer\b',
  '\bmaterials\s+(?:engineer|scientist)\b', '\b(?:chemical|battery)\s+engineer\b',
  '\belectrochem(?:ical|istry)\b',
  '\b(?:mechanical|thermal|structural|civil|construction|manufacturing|industrial)\s+engineer\b',
]

# Titles that may not be taken at their word in either direction: the trade is
# not in the title, but the title is not proof of another trade either. They are
# admitted only if the posting's own text carries the vocabulary, and a posting
# with no readable description carries none -- which is the one place this
# differs from `min_description_chars` below, where silence is given the benefit
# of the doubt. RF is the case that motivated it: `RFIC Digital Verification
# Engineer` and `AMS Verification Engineer (RFIC Engineering)` were being hard
# rejected alongside the analogue-only roles the rule was aimed at.
#
# Whatever survives this is marked in the review queue rather than presented as
# an ordinary result, because it got in on its description and not on its name.
evidence_title_patterns = [
  '\brf\s+engineer\b', '\brf\s*ic\b', '\b(?:microwave|antenna)\s+engineer\b',
]

# Trade-exclusive vocabulary: languages, methodology, protocols, EDA tools and
# fabrication. Another industry has no reason to print these words.
strong_terms = [
  # Languages, methodology, coverage
  '\bUVM\b', '\bSystemVerilog\b', '\bVerilog\b', '\bVHDL\b', '\bSVA\b',
  '\bRTL\b', '\bASIC\b', '\bFPGA\b', '\bSoC\b', '\bVLSI\b',
  '\btestbench\b', '\bnetlist\b', '\bconstrained[- ]random\b', '\bassertion',
  '\bcoverage\s+closure\b', '\bfunctional\s+coverage\b', '\bregression\s+suite\b',
  '\bwaveform\b', '\bformal\s+verification\b', '\bUPF\b', '\bCDC\b', '\bRDC\b',
  # Test and DFT
  '\bDFT\b', '\bATPG\b', '\bscan\s+chain\b', '\bMBIST\b', '\bJTAG\b', '\bTessent\b',
  # Interfaces and IP
  '\bAXI\b', '\bAHB\b', '\bAPB\b', '\bAMBA\b', '\bPCIe\b', '\bCXL\b', '\bUCIe\b',
  '\bDDR\d?\b', '\bLPDDR\b', '\bHBM\b', '\bSerDes\b', '\bMIPI\b', '\bNoC\b',
  # Emulation and prototyping
  '\bemulation\b', '\bPalladium\b', '\bZeBu\b', '\bVeloce\b', '\bFPGA\s+prototyping\b',
  # Physical implementation
  '\bsynthesis\b', '\btiming\s+closure\b', '\bSTA\b', '\bfloorplan',
  '\bplace\s*(?:and|&)\s*route\b', '\bclock\s+tree\b', '\bPPA\b',
  '\bstandard\s+cell\b', '\bLEF\b', '\bDEF\b',
  # EDA vendors and tools
  '\bCadence\b', '\bSynopsys\b', '\bSiemens\s+EDA\b', '\bMentor\s+Graphics\b',
  '\bVCS\b', '\bXcelium\b', '\bQuesta\b', '\bVivado\b', '\bQuartus\b',
  '\bSpyGlass\b', '\bPrimeTime\b', '\bInnovus\b', '\bGenus\b',
  '\bDesign\s+Compiler\b', '\bVerdi\b', '\bConformal\b',
  # Silicon and fabrication
  '\bsilicon\b', '\bpre-?silicon\b', '\bpost-?silicon\b', '\btape-?out\b',
  '\bbring-?up\b', '\bwafer\b', '\bfoundry\b', '\bTSMC\b',
]

# Relevant but ordinary English. Worth a point, never proof on its own.
common_terms = [
  '\bverification\b', '\bvalidation\b', '\bdigital\s+design\b', '\bhardware\b',
  '\bmicroarchitecture\b', '\barchitecture\b', '\bprocessor\b', '\bCPU\b',
  '\bGPU\b', '\bNPU\b', '\baccelerator\b', '\bsemiconductor\b', '\bchip\b',
  '\bintegrated\s+circuit\b', '\bembedded\b', '\blow\s+power\b', '\bdebug\b',
  '\bsimulation\b',
]

# Titles that settle the question on their own, before any scoring runs.
keep_title_patterns = [
  '\b(?:design|hardware|functional|low[-\s]+power)\s+verification\b',
  '\bpre[-\s]?silicon\s+verification\b', '\bformal\s+verification\b',
  '\brtl\b', '\bfpga\b', '\b(?:digital|logic)\s+(?:ic\s+)?design\b',
  '\bdft\b', '\basic\b', '\bvlsi\b', '\bsoc\b', '\bphysical\s+design\b',
]

# Applied after explicit title keeps and before relevance scoring.
reject_title_patterns = [
  '\banalog(?:\s+ic)?\b', '\brf(?:ic)?\b', '\bpcb\b', '\bboard\s+design\b',
  '\bpower\s+electronics\b', '\bprocess\s+engineer\b',
  '\bmanufacturing\s+engineer\b', '\byield\s+engineer\b',
  '\brecruit', '\bquality\s+engineer\b',
  '\bfield\s+application\b', '\bclinical\b',
  '\bpharmaceutic', '\bbiolog', '\bmechanical\s+engineer\b',
  '\bcivil\s+engineer\b', '\bnurse\b', '\baccountant\b',

  # Software roles at hardware companies -- but "software" is not by itself a
  # reason to drop a posting. Embedded, firmware, drivers and silicon bring-up
  # software are adjacent targets, and rejecting on the word alone removed 231
  # such titles from the live store, `Embedded Software Engineer` among them.
  # The lookahead lets any title that also names low-level work fall through to
  # scoring instead; it is not a keep, so a cloud posting that happens to say
  # "hardware" is still dropped by the score. Benchmarking, ML performance and
  # web work name nothing of the sort and are still rejected here.
  '^(?!.*\b(?:embedded|firmware|driver|drivers|bare[-\s]?metal|bootloader|bios|uefi|rtos|kernel|rtl|asic|fpga|soc|silicon|verification|validation|emulation|bring[-\s]?up|hardware|co-?design)\b).*\bsoftware\s+(?:engineer|developer|development)\b',
  '\bweb\s+developer\b', '\bfront.?end\b', '\bback.?end\b', '\bfull.?stack\b',
  '\bdata\s+(?:engineer|scientist)\b', '\bdevops\b', '\bsite\s+reliability\b',
]

# Words that name another function, added 2026-09-22 at the user's request.
# Softer than the group above: a title is dropped for one of these unless it
# names the trade, as above, or names the hardware it is about *and* an
# engineering role or an early-career opening. "CPU Power Engineer", "AI GPU
# Power Architect - New College Grad" and "Intern - NAND Product Development
# Engineer" are silicon work and stay; "Power Integrity Engineer", "Supply
# Chain Planner" and "Business Operations Analyst, Processor" go.
function_title_patterns = [
  '\bpower\b', '\bproducts?\b', '\bsupply\b', '\bmanufactur', '\bmechanical\b',
  '\bmagnetics?\b', '\b(?:project|program)\s+manag', '\boperations?\b',
]
# Job sites whose listings are not worth opening, blocked at the user's request
# on 2026-09-22. Matched against the whole posting link and the publisher name
# JSearch reports, so a republisher is caught either way; a hard pass in the
# paid filter and in the review queue. The live index held 25 open postings
# from us.trabajo.org and none from experteer.com when these were added.
exclude_publisher_patterns = [
  '\bexperteer\b', '\btrabajo\b',
  # One open posting when added: an Intel listing republished in Dutch.
  '\badviesvanspijk\b', '\badvies\s+van\s+spijk\b',
]

# A requirement the applicant cannot meet: U.S. citizenship or U.S. person
# status (citizen, permanent resident, refugee, asylee), usually for export
# control. Read from the description and a hard pass, asked for on 2026-09-22.
# Measured on the live index before deploying: 662 open postings matched the
# first three, every one of 25 sampled a real requirement -- most of them
# Amazon Leo's export-control clause. Deliberately not matched: "the offer may
# be contingent upon your citizenship/permanent residency status or ability to
# obtain prior license approval", which leaves a licence open, a statement
# that merely defines who counts as a U.S. person, and EEO lines about
# "citizenship status".
us_person_required_patterns = [
  '\b(?:must|shall|will\s+need\s+to|required\s+to|need\s+to)\s+(?:be|hold|have|possess|maintain)\s+(?:an?\s+)?(?:\((?:i|1|a)\)\s*)?(?:active\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizen|citizenship|person)\b',
  '(?<!\bno\s)\b(?:U\.?\s?S\.?|United\s+States)\s+(?:citizenship|person\s+status)\s+(?:is\s+)?(?:required|mandatory|a\s+requirement|a\s+must)\b',
  '\brequires?\s+(?:(?:active|current)\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizenship|person\s+status)\b',
  '\brequires?\s+that\s+(?:the\s+)?(?:candidate|applicant|individual|person)s?(?:\s+selected)?\s+(?:be|is|are)\s+(?:an?\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizen|person)',
  '\b(?:only|open\s+(?:only\s+)?to|restricted\s+to\s+(?:\w+\s+){0,3}who\s+are)\s+(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens|persons)\b',
  '\b(?:U\.?\s?S\.?|United\s+States)\s+citizens?\s+only\b',
  '\b(?:must|required\s+to)\s+(?:be|qualify\s+as)\s+(?:an?\s+)?["“]?(?:U\.?\s?S\.?|United\s+States)\s+person',
]
# What the work is on. Enough, with a role below, to keep a function title.
hardware_title_terms = [
  '\bchips?\b', '\bIC\b', '\b3D-?IC\b', '\bsilicon\b', '\bsemiconductors?\b',
  '\bCPU\b', '\bGPU\b', '\bNPU\b', '\bTPU\b', '\bprocessors?\b', '\baccelerators?\b',
  '\bSRAM\b', '\bDRAM\b', '\bNAND\b', '\bHBM\b', '\bmemory\b', '\bcircuits?\b',
  '\bhardware\b', '\belectronics?\b', '\bEDA\b',
  # Not subjects, but at the companies this collects from a "Product
  # Validation" or "Product Engineer - Verification" title is silicon work.
  '\bvalidation\b', '\bverification\b',
]
# The role half: engineering work, or an early-career opening of any kind.
role_title_terms = [
  '\bengineer', '\bdesign', '\barchitect', '\bverification\b', '\bvalidation\b',
  '\btest\b', '\bcharacteri[sz]ation\b', '\bdevelopment\b', '\bdeveloper\b',
  '\bintern', '\bco-?op\b', '\bnew\s+college\s+grad', '\bnew\s+grad', '\bgraduate\b',
  '\bearly\s+career\b', '\bstudent\b', '\bapprentice',
]

