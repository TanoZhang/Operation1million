# Nationwide daily plan. Each broad query has its own maximum depth, asks for
# one page at a time, and stops early when the provider runs short.
version = 1
monthly_quota = 10000
target_utilization = 0.96
operating_days = 30
daily_budget = 320
# The plan renews every 30 days from this date, not on a day of the month.
cycle_start = "2026-09-16"
cycle_days = 30

# The daily budget exists to give the scheduled pass its allowance, so the day
# it paces begins when that pass does -- not at a UTC midnight, which falls at
# 17:00 Pacific and handed the next morning's credits to anything run in the
# evening. Measured once before this was written: a catch-up run at 18:05 and
# 20:10 Pacific took 296 of 320 credits, and the pass eleven hours later got 24
# and reached fifteen of its fifty-two queries.
#
# Keep these in step with deploy/vps/jobdisco-collect.timer. If the timer moves,
# these move with it, or the budget will again reset at a time nothing observes.
budget_timezone = "America/Los_Angeles"
budget_day_resets_at = "04:38"
country = "us"
date_posted = "3days"
# Runaway guard only: the ceiling no tier's depth may exceed.
max_pages_per_query = 40

# A backfill sweep spends credits that expire with the cycle, so it pages far
# deeper than a daily pass before its own runaway guard binds.
backfill_max_pages_per_query = 200

employment_types = ["FULLTIME", "INTERN"]

# Publishers JSearch is asked not to return at all (search-v2's
# exclude_job_publishers, comma-separated names). This asks the provider to
# omit named publishers before filling a page; it does not guarantee zero
# charged pages or zero blocked records returned. The filter still
# checks each result, because how JSearch matches these names is not
# documented and has not been measured. Changing this list changes the search,
# so resumable backfill cursors start again at page one.
exclude_job_publishers = [
  "JobLeads", "Jobrapido", "Learn4Good", "Intern Insider", "Experteer",
  "Trabajo.org", "BeBee", "Jobsora", "Geebo", "Higher-Hire", "Nexxt",
  "Ladders", "TheLadders", "VirginiaCommons", "virginiacommons.com",
  "JobMesh", "Advies Van Spijk",
]

# Priority is intern -> new_grad -> early_career -> A. Daily query caps total
# exactly 320; short and empty pages still stop a query before its cap.
# A month-wide backfill uses separate deeper caps for the same four tiers.
#
# Caps re-set from measurement on 2026-09-27 (docs/jsearch.md, "Query yield"):
# nine days of manifests and the index's paid listings. Most intern, entry
# level and narrow new-grad queries run out after one or two pages, so their
# large caps were never spent and about half of each day's 320 credits went
# unused; the general queries hit their caps every day with results left --
# Physical Design Engineer was capped at one page and still found the most
# useful listings per page of any query. Caps now follow what each query has
# returned, and "Digital Design" phrasings, which mostly return graphic and
# web design, are held to three pages. Tier order is unchanged.
[backfill_tier_pages]
intern = 60
new_grad = 50
early_career = 40
# Deeper than any daily cap in the tier (Design Verification Engineer: 36).
A = 40

[filter]
# Relevance scoring. Terms only ever add; nothing is deducted for a term being
# absent, so a sparsely written posting is never punished for what it omits.
#
#   score      = sum over matched terms of (weight * position multiplier)
#   confidence = 100 * score / (score + half_score)        0..100
#
# A posting carrying `certain_strong_hits` distinct strong terms skips the curve
# and scores 100: that many trade-exclusive proper nouns in one posting is not
# something another industry produces by accident.
#
# To edit: add the term to the list it belongs to. Entries are regular
# expressions matched case-insensitively against the title and the description.
# Bound a term with \b at both ends so it does not match inside a longer word.
# Bulk application policy (2026-10-02): keep borderline relevant jobs ranked lower.
min_confidence = 20
# 0 leaves the curve running instead of flattening every posting that reaches
# a fixed number of strong terms onto 100. Measured: 798 postings read 100,
# the terms behind them ranging from 6 distinct to 34, and nothing at all
# scored between 70 and 99.
certain_strong_hits = 0
half_score = 15
strong_weight = 3
common_weight = 1
title_multiplier = 2
# Below this length a description was truncated by the publisher rather than
# genuinely silent, so its silence is not counted as evidence against a posting.
min_description_chars = 1500
# The least a posting scores when it has no description, or one shorter than
# the line above, by its title's band in `ranking` -- intern/new grad, related
# intern/new grad, core VLSI, related hardware, other. Each is the median score
# of postings in that band that do publish a full description, measured on the
# live index on 2026-09-22 (55, 50, 62, 21, 0 over 67, 57, 893, 783 and 12,571
# postings); the same titles without one had medians of 29, 12, 21, 0 and 0.
title_only_floor = [55, 50, 62, 21, 0]

# Hard exclusions, checked before anything else. These answer "would I take this
# job at all", which no amount of relevance can overturn: a defence programme is
# still a defence programme when the work is verification, and a director is
# still a director. Everything below this point only decides how relevant a
# posting is, never whether it is acceptable.
#
# Company exclusions are matched against employer identity, not job titles.
exclude_employer_patterns = [
  '\bLockheed\s+Martin\b', '\bNorthrop\s+Grumman\b',
  '\bRaytheon\b', '\bGeneral\s+Dynamics\b', '\bBAE\s+Systems\b',
  # "L3 Harris" and "L-3" too (2026-09-27).
  '\bL-?3\s*Harris\b', '\bLeidos\b', '\bAnduril\b',
  # RTX's own businesses, named without RTX (2026-09-27).
  '\bCollins\s+Aerospace\b', '\bPratt\s+(?:&|and)\s+Whitney\b',
  '\bBoeing\b', '\bCACI\b', '\bAmentum\b', '\bPeraton\b',
  # Queued on 2026-10-02 (#293): defence electronics, defence IT, directed
  # energy, autonomous naval vessels, defence consulting.
  '\bMercury\s+Systems\b', '\bManTech\b', '\bEpirus\b', '\bSaronic\b', '\bBooz\s+Allen\b',
  # Ambiguous abbreviations require an exact name or a known corporate suffix.
  '^\s*RTX(?:\s+(?:Corporation|Corp\.?|Inc\.?))?\s*$',
  '^\s*SAIC(?:\s+(?:Corporation|Corp\.?|Inc\.?))?\s*$',
  '\bScience\s+Applications\s+International\s+Corp(?:oration|\.)?(?!\w)',
]

# Role and programme exclusions apply to titles.
exclude_title_patterns = [
  # Human resources roles, not an HR contact mentioned in a description.
  '\bHR\b', '\bhuman\s+resources?\b',
  # Defence and weapons programmes
  '\bdefen[cs]e\b', '\bmilitary\b', '\bDoD\b', '\bDepartment\s+of\s+Defen[cs]e\b',
  '\bwarfighter\b', '\bweapons?\b', '\bweapon\s+systems?\b', '\bmissile\b',
  '\bmunitions?\b', '\bradar\b', '\belectronic\s+warfare\b', '\bEW\s+systems?\b',
  '\bfire\s+control\b', '\btargeting\b', '\bguidance\s+systems?\b',
  '\bcombat\s+systems?\b', '\btactical\s+systems?\b', '\bmission\s+systems?\b',
  '\bdefen[cs]e\s+contractor\b', '\bgovernment\s+clearance\b',
  '\bsecurity\s+clearance\b',
  # A clearance or citizenship named in the title (2026-09-27): "RTL Engineer
  # - TS/SCI", "(Top Secret)", "with Polygraph", "US Citizen Required".
  '\bTS\s*/\s*SCI\b', '\btop\s+secret\b', '\bsecret\s+clearance\b', '\bclearance\s+required\b',
  '\bcleared\b', '\bpolygraph\b',
  '\b(?:U\.?\s?S\.?|United\s+States)\s+citizen(?:s|ship)?\s+(?:required|only)\b',
  # Management: not an individual-contributor track
  '\bdirector\b', '\bmanaging\s+director\b', '\bmanagers?\b',
  '\bvice\s+president\b', '\bVP\b', '\bSVP\b', '\bEVP\b', '\bAVP\b', '\bhead\s+of\b',
  # The same levels abbreviated: "Engineering Mgr" and "Snr. Engineer" were
  # let through while "Manager" and "Senior" were not.
  '\bmgrs?\b', '\bsnr\b',
  # Misspelled: "Program Manger" (Amazon, 2026-10-01).
  '\bmangers?\b',
  '\bchief\b', '\bC[TEIF]O\b',
  # A recruiter is not the trade however silicon the title (2026-09-27), and
  # nor is a security operations centre.
  '\brecruiters?\b', '\btalent\s+acquisition\b',
  # And a sourcer, who finds candidates or parts but not chips: "Talent
  # Sourcer", "Strategic Sourcing Specialist" (2026-10-01).
  '\bsourc(?:er|ers|ing)\b',
  '\bsecurity\s+operations\b', '\bSOC\s+analysts?\b', '\bcyber\s*security\s+SOC\b',
  # "Head, Silicon Engineering", "Team Leader", "Supervisor" (2026-09-27).
  # Not "Head-Mounted Display" or a disk drive's "Head Design".
  '(?<![-\w])head\b(?=\s*(?:,|$|of\b|\s[-–|]))', '\bleaders?\b', '\bsupervisors?\b',
  # Functions that are not the trade at all. These were soft rejects, and a soft
  # reject is only consulted when confidence falls below min_confidence -- but a
  # sales or technician posting at a semiconductor company is written in the
  # trade's vocabulary, so it clears the threshold and the soft reject never
  # fires. Measured on the live queue: 423 sales, 151 marketing and 633
  # technician postings were surviving exactly that way.
  '\bsales\b', '\bmarketing\b', '\btechnician\b',
  # Sales without the word: "Account Executive" and "Account Representative"
  # -- 90 queued groups, one of them in Core VLSI, "Digital IC, Account
  # Technology Executive (ATX)" (2026-10-01).
  '\baccount\s+(?:technology\s+)?executives?\b', '\baccount\s+rep(?:resentative)?s?\b',
  # More functions with no engineering in them, by family, from the live
  # queue on 2026-10-02 (#239-257 in docs/bug-tracker.md; counts are queued
  # groups, nearly all on the Low relevance tab). A technician by its short
  # name (96): "Data Center Tech", "Mechatronics & Robotics Tech".
  '\b(?:data\s+cent(?:er|re)|dc|infra(?:structure)?(?:\s+delivery)?\s+install(?:ation)?|install(?:ation)?|maintenance|mechatronics(?:\s*(?:&|and)\s*robotics)?|robotics|field\s+service|facilities|calibration|repair|lab)\s+techs?\b',
  # Pharmacy and medicine (95).
  '\bpharmac(?:ist|y\s+technician)s?\b', '\bmedical\s+representatives?\b', '\bphysicians?\b',
  '\btherapists?\b', '\bdentists?\b', '\boptometrists?\b',
  # Not openings at all: hiring events, talent pools, event registrations (15).
  '\bhiring\s+events?\b', '\bopen\s+(?:\w+\s+)?career\s+opportunities\b',
  '\bvirtual\s+series\s+registration\b', '\btalent\s+(?:pool|community|network)\b',
  # Delivery and customer service (73); aviation ground operations (59).
  '\bcustomer\s+service\b', '\bdelivery\s+station\b', '\bdelivery\s+(?:driver|associate|trainer)s?\b',
  '\bground\s+handlers?\b', '\bflight\s+monitors?\b',
  # Operators and clerks (8); auditors and investigators (14).
  '\b(?:machine|lab|equipment|rme|forklift|production)\s+operators?\b', '\bclerks?\b',
  '\bauditors?\b', '\binvestigators?\b',
  # Creative work (45): producers, UX writing and design, artists.
  '\bproducers?\b', '\b(?:ux|technical|tech|content|copy)\s*writers?\b',
  '\bux\s+(?:designer|researcher)s?\b', '\b(?:3d|game|technical|visual)\s+artists?\b',
  '\bvisual\s+designers?\b', '\binstructional\s+designers?\b',
  # Strategists and negotiators, which is sales by other names (37).
  '\b(?:account|customer\s+onboarding|growth|marketing|content|brand)\s+strategists?\b', '\bnegotiators?\b',
  # Retail stores (111): Apple's "US-Genius", "US-Creative", "Channel Retail".
  '\bgenius\b', '^US\s*-\s*(?:creative|specialist|technical\s+specialist|expert)\b',
  '\bchannel\s+retail\b', '\bretail\s+(?:store|associate|sales)\b',
  # Consultants (26) and trainers (9).
  '\b(?:customer\s+solutions|growth|business|technical\s+solutions|management|hr|benefits|implementation)\s+consultants?\b',
  '\b(?:driver|delivery|technical|learning\s*(?:&|and)\s*development|safety|sales)\s+trainers?\b',
  # Safety and security staff (177): EHS, fire protection, loss prevention,
  # security officers. Not hardware security: "NPU Physical Security Testing".
  '\bEHS\b', '\benvironmental\s*,?\s*health\s*(?:&|and)\s*safety\b', '\bfire\s+protection\b',
  '\bloss\s+prevention\b', '\bsecurity\s+(?:officer|guard|specialist|investigator)s?\b',
  '\bexecutive\s+protection\b', '\binjury\s+prevention\b',
  # Linguists and raters (4); IT support and help desks (63).
  '\blinguists?\b', '\b(?:data\s+)?annotators?\b', '\braters?\b',
  '\bIT\s+support\b', '\bhelp\s*(?:desk|line)\b', '\bcomputer\s+support\b', '\bdesktop\s+support\b',
  '\bservice\s+desk\b', '\btechnical\s+support\s+(?:analyst|specialist)\b',
  # Administration (35); facility maintenance apprenticeships, RME (34).
  '\badmin(?:istrative)?\s+(?:business\s+)?partners?\b', '\b(?:executive\s+)?business\s+administrator\b',
  '\bstaffing\s+administrator\b', '\badministrative\s+support\b',
  '\bmechatronics?\s+(?:apprentice|technician)s?\b', '\bRME\b',
  # A fab's material handlers and coordinators (#292).
  '\bmaterial\s+handlers?\b', '\b(?:training|moves|event|logistics|equipment)\s+coordinators?\b',
  # Fab process equipment and process modules, as process engineers already
  # are (#295, 76 groups; #296); test equipment stays.
  '(?<!test\s)(?<!ate\s)(?<!slt\s)\bequipment\s+engineer',
  '\bmodule\s+(?:development|integration)\s+engineer',
  '\b(?:etch|dry\s+etch|planar|diffusion|thin\s+film|cmp|litho\w*|implant|deposition)\s+module\s+engineer',
  # Transportation (#297, 49); more of the retail store, "US-Technical
  # Expert", "US-Pro" (#298); business partners by function (#299);
  # construction project engineers (#300).
  '\btransportation\s+(?:associate|specialist|manager|coordinator|analyst)s?\b',
  '^US\s*-\s*(?:technical\s+expert|pro|business\s+expert|operations\s+expert|technician)\b',
  '\b(?:executive|compensation|hr|people|finance|talent)\s+business\s+partners?\b',
  '\bconstruction\s+(?:project\s+)?(?:engineer|manager|lead)\b',
  # Economics and policy (9); real estate and construction planning (8).
  '\beconomists?\b', '\bpolicy\s+(?:specialist|analyst|manager|advisor|investigator)\b', '\bpublic\s+policy\b',
  '\breal\s+estate\b', '\bconstruction\s+(?:scheduler|planner|cost)\b', '\bspace\s+planner\b',
  '\bmaster\s+scheduler\b',
  # Levels above what an early-career application reaches
  # Not the SR of SR-IOV, a PCIe virtualisation feature firmware and driver
  # postings name in the title. Not "(Up to Senior Level)", which hires below
  # it, as with principal below (2026-09-27).
  # Not a student's year: "Intern (Junior/Senior)", "Rising Senior", "Senior
  # Year Internship", "Senior standing", "Senior Design Project" (2026-09-27).
  '(?<!\bup\sto\s)(?<!\brising\s)(?<!\bjunior/)(?<!\bjunior\s/\s)\bsenior\b(?!\s*(?:year|standing|design\s+project))',
  '\bsr\b(?![-\s]?iov\b)\.?',
  # AMD's Senior and Principal Member of Technical Staff (2026-09-27).
  '\b[SP]MTS\b',
  # Principal and lead at the user's request, 2026-09-22 -- but not a posting
  # hiring across levels: "SoC RTL Design Engineer (Up to Principal Level)"
  # and "... Lead & IC Engineers" are open to the levels below, and were the
  # only titles of 2,221 these took that were not a level of their own.
  # "Principle" too, as Astera and NXP write it (2026-10-01).
  '(?<!\bup\sto\s)\bprincip(?:al|le)\b', '\blead\b(?!\s*(?:&|and|/)\s*(?:ic|individual)\b)',
  # Blocked wherever it appears, at the user's request on 2026-09-22; the
  # same word is in exclude_publisher_patterns, which reads the whole link.
  '\btrabajos?\b',
  # Distinguished is the level, whatever follows it: "Distinguished Formal
  # Verification Architect" passed when only the engineer and the member
  # were named (2026-10-01).
  '\bfellow\b', '\bdistinguished\b',
  # An MBA programme is open to MBA students, as a PhD one is to PhD
  # students: "MBA Internships" was on the Early career tab (2026-10-01).
  '\bMBA\b',
  # Unrelated disciplines: title-only exclusions, before explicit trade keeps.
  # "Optical" on its own since 2026-09-23 at the user's request, like
  # photonics: "Optical Module Firmware Intern" and "Hardware Design Engineer,
  # Optical Validation" went through when only "Optical Engineer" was named.
  '\bphotonics?\b', '\boptical\b', '\boptics\s+engineer\b',
  '\boptoelectronics?\b', '\blaser\s+engineer\b',
  '\bprocess\s+(?:engineer|integration)\b', '\bsemiconductor\s+process\b',
  # "Device" on its own is not a fab word: Device Validation, Embedded Device,
  # PCIe Device and Device Driver are all roles worth seeing, and a bare
  # '\bdevice\s+engineer\b' killed them to reach the eighteen fab postings the
  # store actually holds. So only the explicit phrases -- the work named after
  # the transistor rather than after the chip -- and only where a fab process
  # word stands next to it.
  '\bdevice\s+(?:integration|physics|process|characteri[sz]ation|modell?ing)\b',
  '\b(?:semiconductor|silicon|cmos|nand|dram|flash|oled|foundry|fab|wafer|transistor)\b(?:\s+\w+){0,2}\s+device\s+engineer\b',
  '\b(?:process|technology)\s*/\s*device\b', '\bdevice\s*/\s*process\b',
  '\byield\s+engineer\b',
  '\b(?:fab|fabrication)\s+engineer\b', '\blithography\b', '\bthin[-\s]+films?\b',
  '\b(?:etch|deposition)\s+engineer\b',
  '\bmaterials\s+(?:engineer|scientist)\b', '\b(?:chemical|battery)\s+engineer\b',
  '\belectrochem(?:ical|istry)\b',
  # Functions with no engineering in them at all, at the user's request on
  # 2026-09-23: legal, assistants and the energy sector. Not "energy-efficient"
  # or Bluetooth "Low Energy", which describe a chip.
  '\b(?:counsel|attorney|paralegal|litigation|legal)\b', '\bassistants?\b',
  # More functions with no engineering in them, found on the live queue's
  # related tabs on 2026-09-27, where a word like "verification", "silicon" or
  # "HBM" had placed them: finance, accounting, procurement, brand,
  # credentialing, licensing, communications, logistics and business roles;
  # graphic and web design; building facilities.
  '\bfinanc(?:e|ial)\b', '\baccounting\b', '\bprocurement\b', '\bbrand\b', '\bcredentialing\b',
  '\blicensing\b', '\bcommunications\s+specialist\b', '\blogistics\b',
  '\bbusiness\s+(?:planning|analyst|development|systems\s+analyst)\b',
  '\bgraphic\s+(?:or\s+web\s+)?(?:layout\s+)?design', '\bweb\s+(?:layout\s+)?designer\b',
  '\bfacilities\b',
  # "Low-Energy" with a hyphen too (2026-09-27).
  '(?<!\blow\s)(?<!\blow-)\benergy\b(?![-\s]?efficien)',
  '\b(?:mechanical|thermal|structural|civil|construction|manufacturing|industrial)\s+engineer\b',
]

# Titles that may not be taken at their word in either direction: the trade is
# not in the title, but the title is not proof of another trade either. They are
# admitted only if the posting's own text carries the vocabulary, and a posting
# with no readable description carries none -- which is the one place this
# differs from `min_description_chars` below, where silence is given the benefit
# of the doubt. RF is the case that motivated it: `RFIC Digital Verification
# Engineer` and `AMS Verification Engineer (RFIC Engineering)` were being hard
# rejected alongside the analogue-only roles the rule was aimed at.
#
# Whatever survives this is marked in the review queue rather than presented as
# an ordinary result, because it got in on its description and not on its name.
evidence_title_patterns = [
  '\brf\s+engineer\b', '\brf\s*ic\b', '\b(?:microwave|antenna)\s+engineer\b',
]

# Trade-exclusive vocabulary: languages, methodology, protocols, EDA tools and
# fabrication. Another industry has no reason to print these words.
strong_terms = [
  # Languages, methodology, coverage
  # SVA as written, not Amazon's "sva vendors" (#273).
  '\bUVM\b', '\bSystemVerilog\b', '\bVerilog\b', '\bVHDL\b',
  # Analog IC layout and tapeout are chip design, not board-level analog work.
  '\bIC\s+layout\b', '\btape[-\s]?outs?\b', '\bDRC\b', '\bLVS\b',
  '\bCadence\s+Virtuoso\b',
  '(?<!acceleration\s\()(?-i:\bSVA\b)(?!\s+vendors?\b)',
  '\bRTL\b', '\bASIC\b', '\bFPGA\b', '\bVLSI\b',
  # Not the compliance report, "SOC 2 Type II", nor a security operations
  # centre: 20 postings with no chip in them scored on it (2026-10-02).
  '(?<!center\s\()(?<!centre\s\()\bSoC\b(?!\s*-?\s*(?:[123]|ii|iii)\b|\s+(?:type|reports?|audits?|compliance|analysts?|operations)\b)',
  # Not a patent assertion (#271).
  '\btestbench\b', '\bnetlist\b', '\bconstrained[- ]random\b', '(?<!patent\s)\bassertion',
  '\bcoverage\s+closure\b', '\bfunctional\s+coverage\b', '\bregression\s+suite\b',
  '\bwaveform\b', '\bformal\s+verification\b', '\bUPF\b', '\bRDC\b',
  # Clock domain crossing, not change data capture (2026-10-02).
  '(?<!capture\s\()(?<!capture\s)\bCDC\b(?!\s+(?:pipelines?|replication|ingestion|streams?|events?|connectors?)\b)',
  # Test and DFT
  '\bDFT\b', '\bATPG\b', '\bscan\s+chain\b', '\bMBIST\b', '\bJTAG\b', '\bTessent\b',
  # Interfaces and IP
  # Not Amazon Private Brands or Amazon Pay Balance, "(APB)" (#274).
  '\bAXI\b', '\bAHB\b', '(?<!brands\s\()(?<!balance\s\()\bAPB\b', '\bAMBA\b', '\bPCIe\b', '\bCXL\b', '\bUCIe\b',
  '\bDDR\d?\b', '\bLPDDR\b', '\bHBM\b', '\bSerDes\b', '\bMIPI\b',
  # A network on chip is written NoC; NOC is a network operations centre
  # (41 postings, 2026-10-02).
  '(?-i:\bNoC\b)', '\bnetwork[-\s]on[-\s]chip\b',
  # Emulation and prototyping
  # Not a software emulator: "virtualization or emulation (KVM, QEMU)",
  # "the Android emulation" (#270, 2026-10-02).
  '(?<!android\s)(?<!terminal\s)(?<!console\s)(?<!game\s)(?<!software\s)\bemulation\b(?!\s*\(\s*(?:kvm|qemu))',
  '\bPalladium\b', '\bZeBu\b', '\bVeloce\b', '\bFPGA\s+prototyping\b',
  # Physical implementation
  # Not research, data, image or speech synthesis (25 postings, 2026-10-02).
  '(?<!research\s)(?<!data\s)(?<!evidence\s)(?<!speech\s)(?<!voice\s)(?<!video\s)(?<!image\s)(?<!audio\s)(?<!text\s)(?<!insight\s)(?<!insights\s)(?<!knowledge\s)(?<!literature\s)(?<!user\s)(?<!information\s)(?<!qualitative\s)(?<!chemical\s)(?<!protein\s)(?<!organic\s)(?<!drug\s)\bsynthesis\b(?!\s+(?:of\s+(?:research|data|insights?|information|findings|feedback|ideas)|models?)\b)',
  '\btiming\s+closure\b', '\bSTA\b', '\bfloorplan',
  '\bplace\s*(?:and|&)\s*route\b', '\bclock\s+tree\b', '\bPPA\b',
  '\bstandard\s+cell\b', '\bLEF\b', '\bDEF\b',
  # EDA vendors and tools
  # The vendor and the simulators by their names' own case: "the weekly
  # cadence" (233 postings) and "incubators and VCs" (18) are not EDA, and
  # Italian pay notices say "questa posizione" (28) (2026-10-02).
  '(?-i:\bCadence\b)', '\bSynopsys\b', '\bSiemens\s+EDA\b', '\bMentor\s+Graphics\b',
  '(?-i:\bVCS\b)', '\bXcelium\b',
  '(?-i:\bQuesta\b)(?!\s+(?:posizione|offerta|figura|opportunit\w*|ruolo|sede|attivit\w*|azienda|societ\w*))',
  '\bVivado\b', '\bQuartus\b',
  '\bSpyGlass\b', '\bPrimeTime\b', '\bInnovus\b', '\bGenus\b',
  # Not conformal coating, a board assembly process (#272).
  '\bDesign\s+Compiler\b', '\bVerdi\b', '\bConformal\b(?!\s+coat)',
  # Silicon and fabrication
  # Not Silicon Valley, nor Azure AI Foundry or Palantir Foundry (2026-10-02).
  '\bsilicon\b(?!\s+(?:valley|beach|slopes|hills|alley|prairie)\b)', '\bpre-?silicon\b',
  '\bpost-?silicon\b', '\btape-?out\b', '\bbring-?up\b', '\bwafer\b',
  '(?<!azure\sai\s)(?<!\bai\s)(?<!azure\s)(?<!palantir\s)\bfoundry\b(?!\s+(?:local|iq|agents?|models?|portal|ontology)\b)',
  '\bTSMC\b',
]

# Relevant but ordinary English. Worth a point, never proof on its own.
common_terms = [
  '\bverification\b', '\bvalidation\b', '\bdigital\s+design\b', '\bhardware\b',
  '\bmicroarchitecture\b', '\barchitecture\b', '\bprocessor\b', '\bCPU\b',
  '\bGPU\b', '\bNPU\b', '\baccelerator\b', '\bsemiconductor\b', '\bchip\b',
  '\bintegrated\s+circuit\b', '\bembedded\b', '\blow\s+power\b', '\bdebug\b',
  '\bsimulation\b',
]

# Titles that settle the question on their own, before any scoring runs.
keep_title_patterns = [
  # An explicit analog IC design/layout title is VLSI even when a board omits JD prose.
  '\banalog\s+(?:IC|integrated\s+circuit)\s+(?:design|layout)\b',
  '\b(?:design|hardware|functional|low[-\s]+power)\s+verification\b',
  '\bpre[-\s]?silicon\s+verification\b', '\bformal\s+verification\b',
  '\brtl\b', '\bfpga\b', '\b(?:digital|logic)\s+(?:ic\s+)?design\b',
  # Not a security operations centre (2026-09-27): "SOC Analyst".
  '\bdft\b', '\basic\b', '\bvlsi\b', '(?<!\bsecurity\s)(?<!\bcybersecurity\s)\bsoc\b(?!\s*(?:analyst|\d|operations?|support|services?))',
  '\bphysical\s+design\b',
  # Mixed-signal verification is the trade, as rejection_reason's docstring
  # says; only "design verification" was named (2026-09-27).
  '\b(?:ams|mixed[-\s]signal)\s+(?:design\s+)?verification\b',
]

# Applied after explicit title keeps and before relevance scoring.
reject_title_patterns = [
  '\banalog(?:\s+ic)?\b', '\brf(?:ic)?\b', '\bpcb\b', '\bboard\s+design\b',
  '\bpower\s+electronics\b', '\bprocess\s+engineer\b',
  '\bmanufacturing\s+engineer\b', '\byield\s+engineer\b',
  '\brecruit', '\bquality\s+engineer\b',
  # The plural too, "Field Applications Engineer", and its initials (2026-09-27).
  '\bfield\s+applications?\b', '\bFAE\b', '\bclinical\b',
  '\bpharmaceutic', '\bbiolog', '\bmechanical\s+engineer\b',
  '\bcivil\s+engineer\b', '\bnurse\b', '\baccountant\b',

  # Software roles at hardware companies -- but "software" is not by itself a
  # reason to drop a posting. Embedded, firmware, drivers and silicon bring-up
  # software are adjacent targets, and rejecting on the word alone removed 231
  # such titles from the live store, `Embedded Software Engineer` among them.
  # The lookahead lets any title that also names low-level work fall through to
  # scoring instead; it is not a keep, so a cloud posting that happens to say
  # "hardware" is still dropped by the score. Benchmarking, ML performance and
  # web work name nothing of the sort and are still rejected here.
  # EDA, circuit and memory software joined the list on 2026-09-22, when the
  # block first reached direct boards and took "Software Engineer (Integrity
  # 3D-IC Infra)" and "SRAM Software Engineer Intern" with it.
  # Since 2026-09-23 the word itself, not only "software engineer|developer":
  # "Software Engineering Intern", "Software QA Engineer - New College Grad"
  # and "Software and System Architect" slipped past the narrower form. A
  # board with no description scores them 0 but still lists them, so the
  # title is the only thing that can stop them.
  '^(?!.*\b(?:embedded|firmware|driver|drivers|bare[-\s]?metal|bootloader|bios|uefi|rtos|kernel|rtl|asic|fpga|soc|silicon|verification|validation|emulation|bring[-\s]?up|hardware|co-?design|eda|3d-?ic|circuits?|sram|dram|semiconductors?)\b).*\bsoftware\b',
  # Front end and back end are web words and chip words: RTL is a chip's front
  # end and physical design its back end. Measured the same day: "GPU Front-End
  # Infrastructure/Methodology" and "EDA PV Intern for Digital Backend Flow"
  # were going as web roles. A title with a chip-design word stays.
  '\bweb\s+developer\b',
  '^(?!.*\b(?:gpu|cpu|asic|soc|chip|silicon|rtl|cad|dv|methodology|digital|design|verification|eda)\b).*\bfront.?end\b',
  '^(?!.*\b(?:digital|physical|pd|flow|eda|asic|soc|chip|silicon|rtl|sta|timing|implementation|design|verification)\b).*\bback.?end\b',
  '\bfull.?stack\b',
  '\bdata\s+(?:engineer|scientist)\b', '\bdevops\b', '\bsite\s+reliability\b',
]

# Words that name another function, added 2026-09-22 at the user's request.
# Softer than the group above: a title is dropped for one of these unless it
# names the trade, as above, or names the hardware it is about *and* an
# engineering role or an early-career opening. "CPU Power Engineer", "AI GPU
# Power Architect - New College Grad" and "Intern - NAND Product Development
# Engineer" are silicon work and stay; "Power Integrity Engineer", "Supply
# Chain Planner" and "Business Operations Analyst, Processor" go.
function_title_patterns = [
  # "Product" is product management and design, not the product engineering,
  # development and test that is post-silicon work at a chip company: "Product
  # Engineering Intern" and "New College Grad - Product Test Engineer" were
  # going with "Product Management Intern" until 2026-09-22.
  '\bpower\b',
  '\bproducts?\b(?!\s*(?:/\s*test|test|development|engineer|engineering|validation|verification|yield|application))',
  # "Mechancial / Thermal Intern" as well (#286, 2026-10-02).
  '\bsupply\b', '\bmanufactur', '\bmech(?:anical|ancial|nical)\b',
  # "Program Analyst" as well as a manager (2026-09-27).
  '\bmagnetics?\b', '\b(?:project|program)\s+(?:manag|analyst)', '\boperations?\b',
]
