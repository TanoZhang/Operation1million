  '\bnon[-\s]?(?:U\.?\s?S\.?|United\s+States)\s+citizens?\s+(?:(?:are|is)\s+(?:not\s+|in)eligible|(?:are|is|will)\s+not\s+be\s+(?:considered|accepted|eligible)|cannot\s+be\s+(?:considered|accepted|hired))\b',
  '\b(?:unable|not\s+able|cannot)\s+(?:to\s+)?(?:consider|hire|employ|accept)\s+(?:\w+\s+){0,3}who\s+are\s+not\s+(?:U\.?\s?S\.?|United\s+States)\s+citizens\b',
