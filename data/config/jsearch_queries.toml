# Fixed nationwide daily plan: 310 pages plus 6 credits available for configured
# company fallbacks. No automatic expansion when a response is full.
version = 1
monthly_quota = 10000
target_utilization = 0.95
operating_days = 30
daily_budget = 316
billing_cycle_start_day = 1
country = "us"
date_posted = "today"
employment_types = ["FULLTIME", "INTERN"]

[filter]
# Only title text is examined. Unknown/mixed roles and missing experience stay.
reject_title_patterns = [
  '\banalog(?:\s+ic)?\b', '\brf(?:ic)?\b', '\bpcb\b', '\bboard\s+design\b',
  '\bpower\s+electronics\b', '\bprocess\s+engineer\b',
  '\bmanufacturing\s+engineer\b', '\byield\s+engineer\b'
]
keep_title_patterns = ['\bverification\b', '\brtl\b', '\bfpga\b', '\bdigital\b', '\bformal\b', '\bdft\b']

