# A requirement the applicant cannot meet: U.S. citizenship or U.S. person
# status (citizen, permanent resident, refugee, asylee), usually for export
# control. Read from the description and a hard pass, asked for on 2026-09-22.
# Measured on the live index before deploying: 662 open postings matched the
# first three, every one of 25 sampled a real requirement -- most of them
# Amazon Leo's export-control clause. Deliberately not matched: "the offer may
# be contingent upon your citizenship/permanent residency status or ability to
# obtain prior license approval", which leaves a licence open, a statement
# that merely defines who counts as a U.S. person, and EEO lines about
# "citizenship status".
us_person_required_patterns = [
  '\b(?:must|shall|will\s+need\s+to|required\s+to|need\s+to)\s+(?:be|hold|have|possess|maintain)\s+(?:an?\s+)?(?:\((?:i|1|a)\)\s*)?(?:active\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens?|citizenship|persons?)\b',
  # "U.S. citizenship or permanent residency is required" too (2026-09-27).
  '(?<!\bno\s)\b(?:U\.?\s?S\.?|United\s+States)\s+(?:citizenship|person\s+status)(?:\s+or\s+(?:lawful\s+)?permanent\s+residen(?:cy|ce|t\s+status))?\s+(?:is\s+)?(?:required|mandatory|a\s+requirement|a\s+must)\b',
  '\brequires?\s+(?:(?:active|current)\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizenship|person\s+status)\b',
  '\brequires?\s+that\s+(?:the\s+)?(?:candidate|applicant|individual|person)s?(?:\s+selected)?\s+(?:be|is|are)\s+(?:an?\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizen|person)',
  '\b(?:only|open\s+(?:only\s+)?to|restricted\s+to\s+(?:\w+\s+){0,3}who\s+are)\s+(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens|persons)\b',
  # "Position is restricted to U.S. citizens", "limited to United States
  # citizens" (#260, 2026-10-02). "Not limited to" is denied, as before.
  '\b(?:restricted|limited)\s+(?:only\s+)?to\s+(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens|persons)\b',
  # Said of everyone else (#261): "Non-U.S. citizens are not eligible", "We are
  # unable to consider candidates who are not U.S. citizens".
  '\bnon[-\s]?(?:U\.?\s?S\.?|United\s+States)\s+citizens?\s+(?:(?:are|is)\s+(?:not\s+|in)eligible|(?:are|is|will)\s+not\s+be\s+(?:considered|accepted|eligible)|cannot\s+be\s+(?:considered|accepted|hired))\b',
  '\b(?:unable|not\s+able|cannot)\s+(?:to\s+)?(?:consider|hire|employ|accept)\s+(?:\w+\s+){0,3}who\s+are\s+not\s+(?:U\.?\s?S\.?|United\s+States)\s+citizens\b',
  # "US Citizens or Green Card holders only" too (2026-09-27).
  '\b(?:U\.?\s?S\.?|United\s+States)\s+citizens?(?:\s+or\s+(?:green\s+card\s+holders?|(?:lawful\s+)?permanent\s+residents?))?\s+only\b',
  # A form's label: "Required: U.S. Citizenship", "Requirement: US Citizen".
  '\brequire(?:d|ments?)\s*:\s*(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens?(?:hip)?|persons?)\b',
  # Found 2026-09-27. An active clearance is held only by U.S. citizens: "Active
  # TS/SCI clearance required". Not "ability to obtain" one, which is a hope.
  '\b(?:must|shall|required\s+to|need\s+to)\s+(?:have|hold|possess|maintain)\s+(?:an?\s+)?(?:active|current)\s+(?:[\w/-]+\s+){0,3}clearance\b',
  '\b(?:active|current)\s+(?:[\w/-]+\s+){0,3}clearance\s+(?:is\s+)?(?:required|mandatory)\b',
  # Form labels (2026-09-27): "Citizenship: U.S. Citizen", "Clearance
  # Required: TS/SCI", "Security Clearance: Active Secret".
  '\bcitizenship\s*:\s*(?:U\.?\s?S\.?|United\s+States)\s+citizen\b',
  # Read on the live queue, 2026-09-27: "does require the candidate to be a US
  # Persons", "our policy is to only hire "U.S. persons"", "candidates must be
  # either a U.S. citizen or ...".
  '\brequires?\s+(?:the\s+)?(?:candidate|applicant|individual|person)s?(?:\s+selected)?\s+to\s+be\s+(?:an?\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens?|persons?)\b',
  '\bonly\s+(?:hire|employ|consider|accept)\s+["“]?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens|persons)\b',
  '\b(?:must|required\s+to)\s+be\s+either\s+(?:an?\s+)?(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens?|persons?)\b',
  # "U.S. Person required", "US Persons Only" (2026-09-27).
  '(?<!\bno\s)\b(?:U\.?\s?S\.?|United\s+States)\s+persons?\s+(?:is\s+|are\s+)?(?:required|only)\b',
  '\bclearance\s+required\s*:\s*(?:TS\s*/\s*SCI|TS|top\s+secret|secret|Q|L)\b',
  '\bclearance(?:\s+level)?\s*:\s*(?:active|current)\b',
  # "Must be a citizen of the United States".
  '\b(?:must|required\s+to)\s+be\s+(?:an?\s+)?citizens?\s+of\s+the\s+United\s+States\b',
  # "USA citizenship required", "American citizenship required", "a US-citizen".
  '\b(?:USA|U\.S\.A\.?|American)\s+citizenship\s+(?:is\s+)?(?:required|mandatory)\b',
  '\b(?:must|required\s+to)\s+be\s+(?:an?\s+)?U\.?S\.?-citizens?\b',
  # Ruling non-citizens out: "not open to non-U.S. citizens", "Non-US citizens
  # need not apply".
  '\bnot\s+open\s+to\s+non-?\s?(?:U\.?\s?S\.?|United\s+States)\s+citizens\b',
  '\bnon-?\s?(?:U\.?\s?S\.?|United\s+States)\s+citizens\s+(?:need\s+not|may\s+not|cannot|are\s+not\s+eligible\s+to)\s+apply\b',
  '\b(?:must|required\s+to)\s+(?:be|qualify\s+as)\s+(?:an?\s+)?["“]?(?:U\.?\s?S\.?|United\s+States)\s+person',
  # The citizen rather than the citizenship, as a form's value or a bare line:
  # "Citizenship: US Citizen Required", "US Citizen or Green Card required".
  '(?<!\bno\s)\b(?:U\.?\s?S\.?|United\s+States)\s+citizens?(?:\s+or\s+(?:an?\s+)?(?:green\s+card(?:\s+holders?)?|(?:lawful\s+)?permanent\s+residents?))?\s+(?:is\s+|are\s+)?(?:required|mandatory)\b',
]
