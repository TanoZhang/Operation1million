  '\b(?:must|shall|required\s+to|need\s+to)\s+(?:have|hold|possess|maintain)\s+(?:an?\s+)?(?:active|current)\s+(?:[\w/-]+\s+){0,3}clearance\b',
  '\b(?:active|current)\s+(?:[\w/-]+\s+){0,3}clearance\s+(?:is\s+)?(?:required|mandatory)\b',
  # Form labels (2026-09-27): "Citizenship: U.S. Citizen", "Clearance
