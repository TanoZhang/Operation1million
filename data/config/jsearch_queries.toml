  '\b(?:restricted|limited)\s+(?:only\s+)?to\s+(?:U\.?\s?S\.?|United\s+States)\s+(?:citizens|persons)\b',
  # Said of everyone else (#261): "Non-U.S. citizens are not eligible", "We are
