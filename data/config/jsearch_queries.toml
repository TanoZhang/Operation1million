]

# 2026-10-19, the user, on the measured record (each had three or more runs
# and no result passing the filters): renamed STA Intern, ASIC Co-op, CAD New
# Grad, CAD Intern and Test Intern Semiconductor (shorter forms); removed
# DFT Design, CPU Microarchitecture, GPU Architecture, Semiconductor
