# Each pages to its tier's [backfill_tier_pages] depth, or its own `pages`
# up to the sweep's runaway guard (150 for the broad field-and-role phrases).
#
# Revised from the first sweep (2026-10-13, 96 pages, every phrase to the
# provider's last page): the 16 below kept postings. Dropped: the six
# 「LSI 設計 <region>」 splits, 半導体 インターン and 半導体 未経験 設計 (no
