# Reusable ATS connector definitions for complete company-board discovery.
# ATS connectors never use discovery queries. Each company instance is fetched
# as a complete public board, subject to provider pagination and local caps.

version = 13

[defaults]
query_mode = "company_board"
sends_keywords = false
fetch_each_source_instance_once_per_run = true
collect_full_description = false
max_items_per_response = 1000

[ats.greenhouse]
name = "Greenhouse Job Board API"
access_method = "public_job_board_api"
auth = "none_for_get"
endpoint_template = "https://boards-api.greenhouse.io/v1/boards/{board_token}/jobs"
required_instance_fields = ["board_token"]
optional_instance_fields = []
required_secret_fields = []
fetch_strategy = "single_request_local_cap"
title_field = "title"
link_field = "absolute_url"
source_job_id_field = "id"
docs_url = "https://developers.greenhouse.io/job-board.html"
risk_tier = "low"
readiness_status = "ready"

[ats.greenhouse.connection]
http_method = "GET"
accept = "application/json"
response_items_path = "jobs"
auth_location = "none"

[ats.greenhouse.capabilities]
supports_request_row_limit = false
supports_pagination = false

[ats.greenhouse.limits.requests]
scope = "board_instance"
concurrent_requests = 1

[ats.greenhouse.limits.response_processing_cap]
scope = "response"
max_items_per_response = 1000

