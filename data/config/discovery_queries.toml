# Keyword templates are maintained in SQLite search_queries.
# This file contains fallback aliases and legacy filter defaults only.

version = 1

[defaults]
location = "United States"
exclude_terms = ["clearance", "TS/SCI", "secret clearance"]

# Direct source fallbacks: do not bypass CAPTCHA/Human Verification. Combine each
# employer alias with the tiered keyword queries above and send through JSearch.

[[company_fallbacks]]
company_key = "amd"
provider = "jsearch"
employer_aliases = ["AMD", "Advanced Micro Devices"]
reason = "iCIMS returned 405 Human Verification for search and sitemap paths."

[[company_fallbacks]]
company_key = "infineon"
provider = "jsearch"
employer_aliases = ["Infineon"]
reason = "Eightfold app shell downloads but exposes no structured job list; public apply-v2 guesses returned 404/403."

